# Standalone deployment using the pre-built multi-architecture image from GHCR.
services:
  dashboard:
    image: ghcr.io/florincamarut1/linux-server-control:${VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    ports:
      - "${LAN_IP}:8443:3000"
    volumes:
      - ./data:/app/data
      - ./ssh:/run/ssh:ro
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional HTTPS: `docker compose --profile https up -d` serves the dashboard
  # on https://HTTPS_HOST:8444 with a certificate from Caddy's own local CA.
  # Set COOKIE_SECURE=true in .env when you use it. HTTPS_HOST may list several
  # names and addresses, separated by commas (192.168.1.10,server,server.lan):
  # the certificate covers each, and the first is for browsers on an IP address,
  # which send no server name (SNI). Port 8080, not published,
  # gives the CA's root certificate to the dashboard, which offers it for
  # download under Settings → HTTPS certificate.
  https:
    image: caddy:2
    profiles: [https]
    restart: unless-stopped
    environment:
      HTTPS_HOST: ${HTTPS_HOST:-${LAN_IP}}
      CADDYFILE: |
        {
          default_sni {$$HTTPS_FIRST}
        }
        {$$HTTPS_SITES} {
          tls internal
          reverse_proxy dashboard:3000
        }
        http://:8080 {
          root * /data/caddy/pki/authorities/local
          rewrite * /root.crt
          file_server
        }
    command:
      - sh
      - -c
      - |
        HTTPS_FIRST=$$(printf '%s' "$$HTTPS_HOST" | tr -d ' ' | cut -d, -f1)
        HTTPS_SITES=$$(printf '%s' "$$HTTPS_HOST" | tr -d ' ' | sed 's/,,*/,/g; s/^,//; s/,$$//; s|[^,][^,]*|https://&:8444|g; s/,/, /g')
        export HTTPS_FIRST HTTPS_SITES
        printf '%s' "$$CADDYFILE" > /tmp/Caddyfile
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    ports:
      - "${LAN_IP}:8444:8444"
    volumes:
      - caddy_data:/data
    depends_on:
      - dashboard
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
