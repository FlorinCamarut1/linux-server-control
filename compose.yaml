services:
  dashboard:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    ports:
      - "${LAN_IP}:8443:3000"
    volumes:
      - ./data:/app/data
      - ./ssh:/run/ssh:ro
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional HTTPS: `docker compose --profile https up -d` serves the dashboard
  # on https://HTTPS_HOST:8444 with a certificate from Caddy's own local CA.
  # Set COOKIE_SECURE=true in .env when you use it.
  https:
    image: caddy:2
    profiles: [https]
    restart: unless-stopped
    command: caddy reverse-proxy --from https://${HTTPS_HOST:-${LAN_IP}}:8444 --to dashboard:3000 --internal-certs
    ports:
      - "${LAN_IP}:8444:8444"
    volumes:
      - caddy_data:/data
    depends_on:
      - dashboard
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
