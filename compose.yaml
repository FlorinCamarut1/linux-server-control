services:
  dashboard:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    ports:
      - "${LAN_IP}:8080:3000"
    volumes:
      - ./data:/app/data
      - ./ssh:/run/ssh:ro
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
